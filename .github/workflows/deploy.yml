name: Deploy Node App to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Upload files to Hostinger
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" rsync -avz --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "*.log" \
            -e "ssh -p ${{ secrets.HOSTINGER_PORT }} -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }}:${{ secrets.DEPLOY_PATH }}

      - name: Install dependencies on Hostinger
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" ssh \
            -p ${{ secrets.HOSTINGER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }} \
            'source ~/.bashrc || true; source ~/.profile || true; cd ${{ secrets.DEPLOY_PATH }} && npm ci --omit=dev'
      - name: Restart Node app
        run: |
          sshpass -p "${{ secrets.HOSTINGER_PASSWORD }}" ssh \
            -p ${{ secrets.HOSTINGER_PORT }} \
            -o StrictHostKeyChecking=no \
            ${{ secrets.HOSTINGER_USERNAME }}@${{ secrets.HOSTINGER_HOST }} \
            "cd ${{ secrets.DEPLOY_PATH }} && mkdir -p tmp && touch tmp/restart.txt"